[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsvm"
version = "0.1.0"
description = "Dynamic state variable models (stochastic dynamic programming) for behavioural ecology"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Simon Dedman"}, {name = "Michael R. Heithaus"}]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dsvm = "dsvm.cli:main"

[tool.setuptools]
packages = ["dsvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
